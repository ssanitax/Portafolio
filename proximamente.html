<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto en desarrollo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --silver:#C7CCD6;
    --graphite:#1C1F26;
    --dark-gray:#333333;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f5f7;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:var(--dark-gray);
}

.card{
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
    text-align:center;
    max-width:500px;
}

h1{
    font-size:2rem;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-top:10px;
    line-height:1.6;
}

a{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    border-radius:50px;
    text-decoration:none;
    border:1px solid var(--graphite);
    color:var(--graphite);
    transition:0.3s ease;
    font-size:0.9rem;
}

a:hover{
    background:var(--graphite);
    color:white;
}
</style>
</head>

<body>

<div class="card">
    <h1>🚧 Proyecto en desarrollo</h1>
    <p>Estoy trabajando en este proyecto.</p>
    <p>Estará disponible próximamente.</p>

    <a href="index.html">Volver al portafolio</a>
</div>

</body>
</html>
