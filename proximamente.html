<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En desarrollo · Ana Sánchez Suárez</title>
<meta name="description" content="Este proyecto todavía está en desarrollo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1c19;
  --ink-soft: #3d433c;
  --muted: #6a7168;
  --line: rgba(26, 28, 25, 0.12);
  --line-strong: rgba(26, 28, 25, 0.22);
  --paper: #e6e9e3;
  --paper-deep: #d5dbd2;
  --surface: #f4f6f2;
  --moss: #245744;
  --moss-deep: #1a3f31;
  --mist: #b8c7bc;
  --white: #fafbf8;
  --radius: 2px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --nav-h: 4.5rem;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100svh;
  font-family: "Outfit", sans-serif;
  font-weight: 400;
  font-size: 1.05rem;
  line-height: 1.65;
  color: var(--ink);
  background:
    radial-gradient(100% 70% at 90% 10%, rgba(36, 87, 68, 0.1), transparent 55%),
    radial-gradient(80% 50% at 10% 90%, rgba(184, 199, 188, 0.4), transparent 50%),
    linear-gradient(165deg, var(--paper), var(--surface) 55%, var(--paper-deep));
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

a { color: inherit; text-decoration: none; }

.wrap {
  width: min(1120px, calc(100% - 2.5rem));
  margin-inline: auto;
}

.site-nav {
  height: var(--nav-h);
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: rgba(244, 246, 242, 0.72);
  backdrop-filter: blur(12px);
}

.site-nav .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-family: "Fraunces", serif;
  font-weight: 500;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  gap: 1.75rem;
  list-style: none;
}

.nav-links a {
  font-size: 0.9rem;
  position: relative;
  padding-bottom: 0.15rem;
}

.nav-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.45s var(--ease);
}

.nav-links a:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

.page {
  min-height: calc(100svh - var(--nav-h));
  display: grid;
  align-items: center;
  padding: 2rem 0 2.5rem;
}

.panel {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1rem 1.5rem;
  align-items: start;
  max-width: 640px;
}

.index {
  font-family: "Fraunces", serif;
  color: var(--moss);
  font-size: 0.95rem;
  padding-top: 0.55rem;
}

.content h1 {
  font-family: "Fraunces", serif;
  font-weight: 500;
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  letter-spacing: -0.035em;
  line-height: 1.05;
  margin-bottom: 1rem;
}

.content h1 em {
  font-style: italic;
  color: var(--moss);
  font-weight: 400;
}

.content p {
  color: var(--ink-soft);
  max-width: 38ch;
  font-weight: 300;
  margin-bottom: 0.75rem;
}

.meta {
  margin: 1.5rem 0 2rem;
  padding: 1rem 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 0.55rem;
  font-size: 0.92rem;
}

.meta div {
  display: grid;
  grid-template-columns: 6rem 1fr;
  gap: 0.75rem;
}

.meta span {
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--moss);
  padding-top: 0.2rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.85rem;
  padding: 0.7rem 1.35rem;
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease), transform 0.35s var(--ease);
}

.btn-ink {
  background: var(--ink);
  color: var(--white);
}

.btn-ink:hover {
  background: var(--moss-deep);
  transform: translateY(-1px);
}

.btn-line {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}

.btn-line:hover {
  border-color: var(--ink);
  background: rgba(26, 28, 25, 0.04);
}

@media (max-width: 720px) {
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 0.85rem; }
  .panel { grid-template-columns: 1fr; }
  .meta div { grid-template-columns: 1fr; gap: 0.2rem; }
}
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">Ana Sánchez Suárez</a>
    <ul class="nav-links">
      <li><a href="index.html#about">Sobre mí</a></li>
      <li><a href="index.html#projects">Proyectos</a></li>
      <li><a href="index.html#contact">Contacto</a></li>
    </ul>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div class="panel">
      <span class="index">04</span>
      <div class="content">
        <h1>Este proyecto <em>sigue</em> en el taller.</h1>
        <p>
          Estoy trabajando en el prototipo de interfaz. Cuando esté listo para enseñarse con claridad, aparecerá aquí.
        </p>
        <div class="meta">
          <div>
            <span>Estado</span>
            <p>En desarrollo</p>
          </div>
          <div>
            <span>Enfoque</span>
            <p>UI / UX · microinteracciones</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-line" type="button" onclick="history.back()">Volver</button>
          <a class="btn btn-ink" href="index.html">Ir al inicio</a>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
