<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto en desarrollo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --silver:#C7CCD6;
    --graphite:#1C1F26;
    --dark-gray:#333333;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f5f7;
    color:#111;
}

/* NAV (MISMO QUE INDEX) */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 10%;
    background:white;
    position:sticky;
    top:0;
    z-index:1000;
}

nav a{
    text-decoration:none;
    color:#333;
    margin-left:25px;
    font-weight:500;
    position:relative;
}

nav a::after{
    content:"";
    width:0;
    height:2px;
    background:var(--dark-gray);
    position:absolute;
    left:0;
    bottom:-4px;
    transition:0.3s;
}

nav a:hover::after{
    width:100%;
}

/* CONTENIDO */

.wrapper{
    height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.card{
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
    text-align:center;
    max-width:520px;
}

h1{
    font-size:2rem;
    margin-bottom:15px;
    color:var(--dark-gray);
}

p{
    color:#666;
    line-height:1.6;
}

.buttons{
    margin-top:30px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:12px 24px;
    border-radius:50px;
    text-decoration:none;
    border:1px solid var(--graphite);
    color:var(--graphite);
    transition:0.3s ease;
    font-size:0.9rem;
    background:white;
    cursor:pointer;
}

.btn:hover{
    background:var(--graphite);
    color:white;
}

.btn-primary{
    background:var(--graphite);
    color:white;
    border:none;
}

.btn-primary:hover{
    background:var(--dark-gray);
}
</style>
</head>

<body>

<nav>
    <h1>Ana Sánchez Suárez</h1>
    <div>
        <a href="index.html#about">Sobre mí</a>
        <a href="index.html#projects">Proyectos</a>
        <a href="index.html#contact">Contacto</a>
    </div>
</nav>

<div class="wrapper">
    <div class="card">
        <h1>🚧 Proyecto en desarrollo</h1>
        <p>Estoy trabajando en este proyecto.</p>
        <p>Estará disponible próximamente.</p>

        <div class="buttons">
            <button class="btn" onclick="history.back()">Volver atrás</button>
            <a href="index.html" class="btn btn-primary">Ir al inicio</a>
        </div>
    </div>
</div>

</body>
</html>
